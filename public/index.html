<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirante · o planeta ao vivo</title>
    <meta
      name="description"
      content="Globo 3D com voos sobre o Brasil, terremotos e satélites em tempo real, usando apenas dados abertos."
    />
    <link rel="icon" href="img/icone.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
  </head>
  <body data-modo="normal">
    <div id="globo"></div>
    <div class="vinheta" aria-hidden="true"></div>

    <div class="visor" id="visor" hidden>
      <svg class="visor-bussola" id="visor-bussola" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
      <svg class="visor-mira" viewBox="-60 -60 120 120" aria-hidden="true">
        <path d="M-60 0H-14M14 0H60M0-60V-14M0 14V60" />
        <path d="M-32-24V-32H-24M24-32H32V-24M32 24V32H24M-24 32H-32V24" />
        <circle r="2" />
      </svg>
      <p class="visor-cabecalho">
        <span class="visor-rec">●</span> REC <span data-campo="rec">--:--:--Z</span>
      </p>
      <dl class="visor-dados visor-esquerda">
        <dt>Alvo</dt>
        <dd data-campo="alvo">—</dd>
        <dt>Solo</dt>
        <dd data-campo="solo">—</dd>
        <dt>Altitude</dt>
        <dd data-campo="altitude">—</dd>
        <dt>Distância</dt>
        <dd data-campo="distancia">—</dd>
      </dl>
      <dl class="visor-dados visor-direita">
        <dt>Rumo</dt>
        <dd data-campo="rumo">—</dd>
        <dt>Inclinação</dt>
        <dd data-campo="inclinacao">—</dd>
        <dt>Resolução</dt>
        <dd data-campo="resolucao">—</dd>
        <dt>Sol</dt>
        <dd data-campo="sol">—</dd>
      </dl>
    </div>

    <header class="marca">
      <img src="img/icone.svg" alt="" width="34" height="34" />
      <div>
        <h1>MIRANTE</h1>
        <p>o planeta ao vivo</p>
      </div>
    </header>

    <div class="status">
      <span id="relogio-utc" class="relogio">--:--:-- UTC</span>
      <span id="relogio-brasilia" class="relogio-local">Brasília --:--</span>
      <span class="contagens" aria-label="Dados carregados">
        <span title="Voos"><i class="ponto voos"></i><b id="conta-voos">…</b></span>
        <span title="Terremotos (24 h)"><i class="ponto terremotos"></i><b id="conta-terremotos">…</b></span>
        <span title="Satélites"><i class="ponto satelites"></i><b id="conta-satelites">…</b></span>
        <span title="Prédios em 3D"><i class="ponto predios"></i><b id="conta-predios">…</b></span>
      </span>
    </div>

    <details class="gaveta">
      <summary>Camadas</summary>
      <label class="camada" data-camada="voos">
        <input type="checkbox" checked />
        <i class="ponto voos"></i>
        <span>Voos no Brasil</span>
      </label>
      <label class="camada" data-camada="terremotos">
        <input type="checkbox" checked />
        <i class="ponto terremotos"></i>
        <span>Terremotos (24 h)</span>
      </label>
      <label class="camada" data-camada="satelites">
        <input type="checkbox" checked />
        <i class="ponto satelites"></i>
        <span>Satélites e estações</span>
      </label>
      <label class="camada" data-camada="predios">
        <input type="checkbox" checked />
        <i class="ponto predios"></i>
        <span>Prédios em 3D</span>
      </label>
    </details>

    <article class="ficha" id="ficha" hidden aria-live="polite">
      <button class="fechar" id="fechar-ficha" type="button" aria-label="Fechar">×</button>
      <p class="ficha-tipo" id="ficha-tipo"></p>
      <h3 id="ficha-titulo"></h3>
      <dl id="ficha-dados"></dl>
      <a id="ficha-link" target="_blank" rel="noopener noreferrer" hidden></a>
    </article>

    <nav class="dock" aria-label="Destinos e modos de visão">
      <div class="dock-grupo" role="group" aria-label="Ir para">
        <button type="button" data-destino="brasil">Brasil</button>
        <button type="button" data-destino="planeta">Planeta</button>
        <button type="button" data-destino="saopaulo">São Paulo</button>
        <button type="button" data-destino="rio">Rio</button>
        <button type="button" data-destino="fortaleza">Fortaleza</button>
        <button type="button" data-destino="iss">ISS</button>
      </div>
      <span class="dock-separador" aria-hidden="true"></span>
      <div class="dock-grupo" role="group" aria-label="Modo de visão">
        <button type="button" data-modo="normal" class="ativo">Normal</button>
        <button type="button" data-modo="noturna">Noturna</button>
        <button type="button" data-modo="termica">Térmica</button>
        <button type="button" id="alternar-visor" class="ativo" aria-pressed="true">Visor</button>
      </div>
    </nav>

    <footer class="creditos">
      <span>
        <a href="https://adsb.lol" target="_blank" rel="noopener">adsb.lol</a> ·
        <a href="https://earthquake.usgs.gov" target="_blank" rel="noopener">USGS</a> ·
        <a href="https://celestrak.org" target="_blank" rel="noopener">CelesTrak</a> ·
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>
        · Esri
      </span>
      <div id="creditos-cesium"></div>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
